# Builds a Windows x64 installer for the Bluetooth-enabled Deskflow fork.
# Manual/small-scope workflow: only Windows x64, Release, packaged output.
#
# Notes:
#  * aqtinstall 3.3.0 cannot resolve the Qt >= 6.11 repository layout, so this
#    workflow pins the newest Qt release that still uses the classic layout.
#  * OpenSSL comes from the OpenSSL that the windows-2022 image ships, which
#    keeps the build short (no vcpkg bootstrap) and is what find_package wants.
#  * -DCMAKE_COMPILE_WARNING_AS_ERROR is deliberately left out so that a new
#    compiler warning cannot hide the actual packaging result.

name: Bluetooth Windows build

on:
  push:
    branches: [bluetooth-transport]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

env:
  DESKFLOW_VERSION_LABEL: "bluetooth"

jobs:
  windows-x64:
    name: windows-x64 (Bluetooth)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64
          spectre: true

      - name: Install Qt (with Bluetooth module)
        uses: jurplel/install-qt-action@v4
        env:
          # Use the same Qt mirror as the upstream CI; download.qt.io times out.
          AQT_CONFIG: ${{ github.workspace }}/.github/actions/install-dependencies/aqt.ini
        with:
          version: "6.10.3"
          arch: win64_msvc2022_64
          modules: qtconnectivity
          cache: true

      - name: Install WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.Firewall.wixext/5.0.2

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          ninja --version

          openssl_root=""
          for candidate in "/c/Program Files/OpenSSL" "/c/Program Files/OpenSSL-Win64"; do
            if [ -d "$candidate" ]; then
              openssl_root="$(cygpath -m "$candidate")"
              break
            fi
          done
          if [ -z "$openssl_root" ]; then
            echo "::error::no OpenSSL installation found"
            exit 1
          fi
          echo "using OpenSSL at $openssl_root"

          cmake -Bbuild -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSKIP_BUILD_TESTS=ON \
            -DDESKFLOW_ENABLE_BLUETOOTH=ON \
            -DOPENSSL_ROOT_DIR="$openssl_root" \
            -DPACKAGE_VERSION_LABEL="${{ env.DESKFLOW_VERSION_LABEL }}"

      - name: Check Bluetooth support was enabled
        shell: bash
        run: |
          grep -iE "DESKFLOW_ENABLE_BLUETOOTH|Qt6Bluetooth_DIR" build/CMakeCache.txt

      - name: Build and package
        shell: bash
        run: cmake --build build --config Release -j8 --target package

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          cp build/*.msi dist/ 2>/dev/null || true
          cp build/*.zip dist/ 2>/dev/null || true
          ls -la dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: deskflow-windows-x64-bluetooth
          path: dist/*
          if-no-files-found: error
          retention-days: 30
